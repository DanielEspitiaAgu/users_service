# Opt-in profile for initializing a verified, empty PostgreSQL schema.
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=false
spring.flyway.clean-disabled=true
spring.flyway.create-schemas=false
spring.jpa.hibernate.ddl-auto=validate

# The operator must provide both values at startup. The migration guard checks
# the actual database name and requires the exact confirmation phrase.
users.flyway.fresh.database-name=${USERS_FLYWAY_FRESH_DATABASE_NAME:}
users.flyway.fresh.confirmation=${USERS_FLYWAY_FRESH_CONFIRMATION:}
