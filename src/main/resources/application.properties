# SERVIDOR
spring.application.name=usuarios-service
server.port=${SERVER_PORT:8081}

# EUREKA
eureka.client.service-url.defaultZone=${EUREKA_SERVER_URL:http://localhost:8762/eureka/}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.hostname=${EUREKA_INSTANCE_HOSTNAME:localhost}
eureka.instance.prefer-ip-address=false

# ACTUATOR
management.endpoints.web.base-path=/
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# POSTGRESQL
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/usuariosdb}
spring.datasource.username=${DB_USERNAME:usuarios}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / HIBERNATE
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${JPA_FORMAT_SQL:false}

# FLYWAY
spring.flyway.enabled=false

# JWT
jwt.secret=${JWT_SECRET:change-this-development-secret-32-characters}
jwt.expiration=${JWT_EXPIRATION:3600000}
jwt.token-prefix=${JWT_TOKEN_PREFIX:Bearer }

# LOGS
logging.level.org.hibernate.SQL=${HIBERNATE_SQL_LOG_LEVEL:INFO}

# ADMINISTRATOR
app.admin.email=${ADMIN_EMAIL:admin@hopedoku.local}
app.admin.username=${ADMIN_USERNAME:admin}
app.admin.password=${ADMIN_PASSWORD:}

# INTERNAL SERVICE AUTHENTICATION
internal.api-token=${INTERNAL_API_TOKEN:}
