# ============================================
# CONFIGURACIÓN DEL SERVIDOR
# ============================================
spring.application.name=usuarios-service
server.port=8081

# ============================================
# BASE DE DATOS H2 (en memoria, para desarrollo)
# ============================================
spring.datasource.url=jdbc:h2:mem:usuariosdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Consola web de H2 → http://localhost:8081/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ============================================
# JPA / HIBERNATE
# ============================================
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ============================================
# JWT (variables que usaremos más adelante)
# ============================================
# Cambia este secreto en producción. Mínimo 32 caracteres.
jwt.secret=ClaveSuperSecretaParaDesarrolloCambiarEnProduccion123456
jwt.expiration=3600000
jwt.token-prefix=Bearer 
jwt.header-string=Authorization

# ============================================
# LOGS (opcional, útil en desarrollo)
# ============================================
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.springframework.security=DEBUG