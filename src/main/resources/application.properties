# SERVIDOR
spring.application.name=usuarios-service
server.port=${SERVER_PORT:8081}

# Authentication comes exclusively from the trusted gateway headers.
spring.autoconfigure.exclude=org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration

# EUREKA
eureka.client.service-url.defaultZone=${EUREKA_SERVER_URL:http://localhost:8762/eureka/}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.hostname=${EUREKA_INSTANCE_HOSTNAME:localhost}
eureka.instance.prefer-ip-address=false

# ACTUATOR
management.endpoints.web.base-path=/
management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.show-details=never
management.metrics.tags.application=${spring.application.name}

# POSTGRESQL
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/usuariosdb}
spring.datasource.username=${DB_USERNAME:usuarios}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / HIBERNATE
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${JPA_FORMAT_SQL:false}

# FLYWAY
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
# Existing Hibernate-managed installations already contain the V1-V3 schema.
# Baseline those objects and apply only additive migrations such as the saga outbox.
spring.flyway.baseline-version=3
spring.flyway.clean-disabled=true

# LOGS
logging.level.org.hibernate.SQL=${HIBERNATE_SQL_LOG_LEVEL:INFO}

# Trusted gateway identity
security.gateway-secret=${GATEWAY_SECRET:}

# INTERNAL SERVICE AUTHENTICATION
internal.api-token=${INTERNAL_API_TOKEN:}

# Domain events
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.listener.ack-mode=record
events.match-finished-topic=${MATCH_FINISHED_TOPIC:matches.finished.v1}
events.match-finished-dlq=${MATCH_FINISHED_DLQ_TOPIC:matches.finished.dlq}
events.users-group=${KAFKA_GROUP_ID_USUARIOS:usuarios-match-results}
events.users-dlq-group=${KAFKA_GROUP_ID_USUARIOS_DLQ:usuarios-match-results-dlq}
events.saga-outbox.poll-interval-ms=${MATCH_SAGA_OUTBOX_POLL_INTERVAL_MS:1000}
events.saga-outbox.initial-delay-ms=${MATCH_SAGA_OUTBOX_INITIAL_DELAY_MS:1000}
events.saga-outbox.batch-size=${MATCH_SAGA_OUTBOX_BATCH_SIZE:25}
events.saga-outbox.lease-seconds=${MATCH_SAGA_OUTBOX_LEASE_SECONDS:120}
events.saga-outbox.ack-timeout-ms=${MATCH_SAGA_OUTBOX_ACK_TIMEOUT_MS:10000}
