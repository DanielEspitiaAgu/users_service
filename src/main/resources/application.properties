# ============================================
# SERVIDOR
# ============================================
spring.application.name=usuarios-service
server.port=8081

# ============================================
# EUREKA
# ============================================
eureka.client.service-url.defaultZone=${EUREKA_SERVER_URL:http://localhost:8762/eureka/}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# ============================================
# POSTGRESQL
# ============================================
spring.datasource.url=jdbc:postgresql://localhost:5432/usuariosdb
spring.datasource.username=usuarios
spring.datasource.password=usuarios123
spring.datasource.driver-class-name=org.postgresql.Driver

# ============================================
# JPA / HIBERNATE
# ============================================
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ============================================
# FLYWAY (desactivado por ahora)
# ============================================
spring.flyway.enabled=false

# ============================================
# JWT
# ============================================
jwt.secret=ClaveSuperSecretaParaDesarrolloCambiarEnProduccion123456
jwt.expiration=3600000
jwt.token-prefix=Bearer 
jwt.header-string=Authorization

# ============================================
# LOGS
# ============================================
logging.level.org.hibernate.SQL=DEBUG